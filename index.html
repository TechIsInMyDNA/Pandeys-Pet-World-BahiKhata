<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pandeys Pet World BahiKhata</title>
  <style>
    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --primary-light: #ecfdf5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --success: #10b981;
      --success-bg: #f0fdf4;
      --border: #e2e8f0;
      --radius: 14px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 95px; user-select: none; }

    .app-header {
      background: #ffffff;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 40;
      border-bottom: 1px solid var(--border);
    }
    .brand-title { font-size: 1.15rem; font-weight: 800; color: var(--primary); }
    .sync-status { font-size: 0.72rem; display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-weight: 500; margin-top: 2px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #eab308; }
    .dot.synced { background: var(--success); }
    .dot.offline { background: var(--danger); }
    .settings-btn {
      background: #f1f5f9;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .summary-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 14px 16px;
    }
    .stat-card {
      background: var(--card-bg);
      padding: 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .stat-card h3 { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .stat-card p { font-size: 1.35rem; font-weight: 800; margin-top: 4px; }
    .text-danger { color: var(--danger); }
    .text-success { color: var(--success); }

    .search-box { padding: 0 16px 12px; }
    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      outline: none;
      font-size: 0.92rem;
      background: white;
    }
    .search-input:focus { border-color: var(--primary); }

    .customer-list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
    .customer-card {
      background: var(--card-bg);
      padding: 15px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .customer-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
    }
    .customer-card.vyavaharik::before { background: var(--success); }
    .customer-card.defaulter::before { background: var(--danger); }

    .cust-info h4 { font-size: 1rem; font-weight: 700; margin-bottom: 2px; }
    .cust-info p { font-size: 0.8rem; color: var(--text-muted); }
    .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 6px;
    }
    .badge-vyavaharik { background: var(--success-bg); color: #047857; }
    .badge-defaulter { background: var(--danger-bg); color: #b91c1c; }
    .cust-balance { text-align: right; }
    .cust-balance span { font-size: 1.15rem; font-weight: 800; display: block; }
    .cust-balance small { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }

    .fab-container {
      position: fixed;
      bottom: 20px;
      left: 16px;
      right: 16px;
      z-index: 30;
    }
    .fab {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(5,150,105,0.25);
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(3px);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 24px 24px 0 0;
      padding: 22px 20px;
      max-height: 92vh;
      overflow-y: auto;
      animation: sheetUp 0.2s ease-out;
    }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-header h2 { font-size: 1.15rem; font-weight: 800; }
    .close-btn { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      outline: none;
      background: #f8fafc;
    }
    .form-control:focus { background: #ffffff; border-color: var(--primary); }

    .calc-container {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 14px;
    }
    .calc-screen {
      width: 100%;
      font-size: 1.5rem;
      font-weight: 800;
      text-align: right;
      padding: 8px 12px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .preset-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }
    .preset-chip {
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 4px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .calc-key {
      padding: 12px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }
    .calc-key.op { background: #f1f5f9; color: var(--primary); }

    .message-options {
      display: flex;
      gap: 16px;
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 10px;
      margin: 12px 0 16px;
    }
    .chk-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .chk-label input { width: 17px; height: 17px; accent-color: var(--primary); }

    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-action {
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-debit { background: var(--danger); color: white; }
    .btn-credit { background: var(--success); color: white; }
    .btn-full { width: 100%; background: var(--primary); color: white; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    .btn-secondary { width: 100%; background: #0284c7; color: white; padding: 12px; border: none; border-radius: 10px; font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-bottom: 8px; }
    .btn-outline { width: 100%; background: white; border: 1px solid var(--border); padding: 10px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-bottom: 6px; }

    .tx-scrollbox { max-height: 140px; overflow-y: auto; margin-bottom: 14px; }
    .tx-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.85rem;
    }
    .section-divider {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-muted);
      margin: 16px 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div>
      <div class="brand-title">Pandeys Pet World</div>
      <div class="sync-status">
        <span class="dot" id="syncDot"></span>
        <span id="syncText">Connecting...</span>
      </div>
    </div>
    <button class="settings-btn" onclick="openConfigModal()">⚙️</button>
  </header>

  <section class="summary-container">
    <div class="stat-card">
      <h3>Kul Lena Hai</h3>
      <p class="text-danger" id="totalDue">₹0</p>
    </div>
    <div class="stat-card">
      <h3>Kul Advance/Jama</h3>
      <p class="text-success" id="totalPaid">₹0</p>
    </div>
  </section>

  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="Search customer or mobile..." oninput="renderCustomerList()">
  </div>

  <main class="customer-list" id="customerList"></main>

  <div class="fab-container">
    <button class="fab" onclick="openAddCustomerModal()">+ Add Customer</button>
  </div>

  <!-- Modal: Add Customer -->
  <div class="modal" id="addCustomerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Add Customer</h2>
        <button class="close-btn" onclick="closeModal('addCustomerModal')">&times;</button>
      </div>
      <div class="form-group">
        <label>Customer Name *</label>
        <input type="text" id="newCustName" class="form-control" placeholder="e.g. Rahul Sharma">
      </div>
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" id="newCustPhone" class="form-control" placeholder="10-digit number">
      </div>
      <button class="btn-full" onclick="saveNewCustomer()">Save Customer</button>
    </div>
  </div>

  <!-- Modal: Ledger Entry -->
  <div class="modal" id="ledgerModal">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h2 id="ledgerCustName">Customer</h2>
          <p id="ledgerCustPhone" style="font-size:0.8rem; color:var(--text-muted);"></p>
        </div>
        <button class="close-btn" onclick="closeModal('ledgerModal')">&times;</button>
      </div>

      <div style="background:#f8fafc; border:1px solid var(--border); padding:12px; border-radius:12px; margin-bottom:12px; text-align:center;">
        <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600;">NET BALANCE</span>
        <h3 id="ledgerNetBalance" style="font-size:1.4rem; font-weight:800; margin:3px 0;">₹0</h3>
        <span id="ledgerBehaviorBadge" class="badge"></span>
      </div>

      <div class="tx-scrollbox" id="ledgerTxList"></div>

      <div class="calc-container">
        <input type="text" id="calcScreen" class="calc-screen" value="0" readonly>
        <div class="preset-row" id="presetButtonsContainer"></div>
        <div class="calc-grid">
          <button class="calc-key" onclick="calcPress('7')">7</button>
          <button class="calc-key" onclick="calcPress('8')">8</button>
          <button class="calc-key" onclick="calcPress('9')">9</button>
          <button class="calc-key op" onclick="calcPress('/')">÷</button>
          <button class="calc-key" onclick="calcPress('4')">4</button>
          <button class="calc-key" onclick="calcPress('5')">5</button>
          <button class="calc-key" onclick="calcPress('6')">6</button>
          <button class="calc-key op" onclick="calcPress('*')">×</button>
          <button class="calc-key" onclick="calcPress('1')">1</button>
          <button class="calc-key" onclick="calcPress('2')">2</button>
          <button class="calc-key" onclick="calcPress('3')">3</button>
          <button class="calc-key op" onclick="calcPress('-')">-</button>
          <button class="calc-key" onclick="calcClear()">C</button>
          <button class="calc-key" onclick="calcPress('0')">0</button>
          <button class="calc-key op" onclick="calcEval()">=</button>
          <button class="calc-key op" onclick="calcPress('+')">+</button>
        </div>
      </div>

      <div class="form-group">
        <label>Date</label>
        <input type="date" id="txDate" class="form-control">
      </div>
      <div class="form-group">
        <label>Item / Note</label>
        <input type="text" id="txNote" class="form-control" placeholder="e.g. Royal Canin 4kg">
      </div>

      <div class="message-options">
        <label class="chk-label">
          <input type="checkbox" id="chkWhatsApp" onchange="persistMessagePreferences()">
          <span>WhatsApp Message</span>
        </label>
        <label class="chk-label">
          <input type="checkbox" id="chkTextSMS" onchange="persistMessagePreferences()">
          <span>Text SMS</span>
        </label>
      </div>

      <div class="action-grid">
        <button class="btn-action btn-debit" onclick="recordTransaction('GIVEN')">Udhar Diya</button>
        <button class="btn-action btn-credit" onclick="recordTransaction('GOT')">Jama Kiya</button>

  <!-- Modal: Settings, Backups, Exports & OkCredit Import -->
  <div class="modal" id="configModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>App, Backup & Cloud</h2>
        <button class="close-btn" onclick="closeModal('configModal')">&times;</button>
      </div>

      <div class="section-divider">DATA BACKUP & EXCEL EXPORT</div>
      <button class="btn-secondary" onclick="exportToExcel()">📊 Export to Excel (.csv)</button>
      <button class="btn-outline" onclick="downloadJsonBackup()">💾 Download Backup (JSON)</button>
      <label class="btn-outline" style="display:block; text-align:center; cursor:pointer;">
        📥 Restore Backup (JSON)
        <input type="file" id="jsonFileInput" accept=".json" style="display:none;" onchange="restoreJsonBackup(event)">
      </label>

      <div class="section-divider">IMPORT FROM OKCREDIT</div>
      <label class="btn-outline" style="display:block; text-align:center; background:#e0f2fe; color:#0369a1; border-color:#bae6fd; cursor:pointer;">
        🔄 Import OkCredit File (.csv / .json)
        <input type="file" id="okcreditFileInput" accept=".csv,.json" style="display:none;" onchange="importFromOkCredit(event)">
      </label>

      <div class="section-divider">CALCULATOR PRESETS (%)</div>
      <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:12px;">
        <div>
          <label style="font-size:0.75rem; color:var(--text-muted);">Preset 1</label>
          <input type="number" id="cfgPreset1" class="form-control" placeholder="-5">
        </div>
        <div>
          <label style="font-size:0.75rem; color:var(--text-muted);">Preset 2</label>
          <input type="number" id="cfgPreset2" class="form-control" placeholder="8">
        </div>
        <div>
          <label style="font-size:0.75rem; color:var(--text-muted);">Preset 3</label>
          <input type="number" id="cfgPreset3" class="form-control" placeholder="-10">
        </div>
      </div>

      <div class="section-divider">GITHUB CLOUD SYNC (256-BIT ENCRYPTION)</div>
      <div class="form-group">
        <label>GitHub Personal Access Token (No Expiration)</label>
        <input type="password" id="cfgToken" class="form-control" placeholder="ghp_xxxxxxxxxxxx">
      </div>
      <div class="form-group">
        <label>GitHub Username</label>
        <input type="text" id="cfgUsername" class="form-control" placeholder="TechIsInMyDNA">
      </div>
      <div class="form-group">
        <label>Repository Name</label>
        <input type="text" id="cfgRepo" class="form-control" placeholder="Pandeys-Pet-World-BahiKhata">
      </div>
      <div class="form-group">
        <label>Master Passphrase (Encryption Key)</label>
        <input type="password" id="cfgPassphrase" class="form-control" placeholder="Apna secret passphrase banayein">
      </div>

      <button class="btn-full" onclick="saveSettings()">Save & Sync Database</button>
    </div>
  </div>

  <script>
    let appData = { customers: [], lastUpdated: 0 };
    let currentCustomerId = null;
    let syncSha = null;
    let isSyncing = false;
    let calcExpression = "0";

    const DB_FILE = "bahikhata_data.enc";

    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('txDate').valueAsDate = new Date();

      loadPresetButtons();
      loadMessagePreferences();
      loadLocalData();
      renderCustomerList();

      if (!isConfigured()) {
        openConfigModal();
        updateSyncStatus('offline', 'Setup Required');
      } else {
        await syncData();
      }

      window.addEventListener('online', () => syncData());
      window.addEventListener('offline', () => updateSyncStatus('offline', 'Offline (Local)'));
    });

    function isConfigured() {
      return localStorage.getItem('gh_token') &&
             localStorage.getItem('gh_user') &&
             localStorage.getItem('gh_repo') &&
             localStorage.getItem('sec_pass');
    }

    function loadPresetButtons() {
      const p1 = parseFloat(localStorage.getItem('cfg_p1') || "-5");
      const p2 = parseFloat(localStorage.getItem('cfg_p2') || "8");
      const p3 = parseFloat(localStorage.getItem('cfg_p3') || "-10");

      const container = document.getElementById('presetButtonsContainer');
      container.innerHTML = `
        <button class="preset-chip" onclick="applyPreset(${p1})">${p1 > 0 ? '+' : ''}${p1}%</button>
        <button class="preset-chip" onclick="applyPreset(${p2})">${p2 > 0 ? '+' : ''}${p2}%</button>
        <button class="preset-chip" onclick="applyPreset(${p3})">${p3 > 0 ? '+' : ''}${p3}%</button>
      `;
    }

    function loadMessagePreferences() {
      const waPref = localStorage.getItem('pref_msg_wa');
      const smsPref = localStorage.getItem('pref_msg_sms');
      document.getElementById('chkWhatsApp').checked = (waPref === 'true');
      document.getElementById('chkTextSMS').checked = (smsPref === 'true');
    }

    function persistMessagePreferences() {
      localStorage.setItem('pref_msg_wa', document.getElementById('chkWhatsApp').checked);
      localStorage.setItem('pref_msg_sms', document.getElementById('chkTextSMS').checked);
    }

    /* ==========================================
       CRYPTO ENGINE: PBKDF2 + AES-GCM
       ========================================== */
    async function deriveKey(passphrase, salt) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        "raw",
        enc.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptPayload(plainText, passphrase) {
      const enc = new TextEncoder();
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(passphrase, salt);

      const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, enc.encode(plainText));
      const combined = new Uint8Array(salt.length + iv.length + cipher.byteLength);
      combined.set(salt, 0);
      combined.set(iv, salt.length);
      combined.set(new Uint8Array(cipher), salt.length + iv.length);

      return btoa(String.fromCharCode.apply(null, combined));
    }

    async function decryptPayload(base64Data, passphrase) {
      const binary = atob(base64Data);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

      const salt = bytes.slice(0, 16);
      const iv = bytes.slice(16, 28);
      const cipher = bytes.slice(28);

      const key = await deriveKey(passphrase, salt);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, cipher);

      return new TextDecoder().decode(decrypted);
    }

    /* ==========================================
       GITHUB 2-WAY SYNC
       ========================================== */
    function loadLocalData() {
      const local = localStorage.getItem('local_bahikhata_cache');
      if (local) {
        try { appData = JSON.parse(local); } catch (e) { appData = { customers: [], lastUpdated: Date.now() }; }
      }
    }

    function saveLocalData() {
      appData.lastUpdated = Date.now();
      localStorage.setItem('local_bahikhata_cache', JSON.stringify(appData));
    }

    function updateSyncStatus(type, msg) {
      const dot = document.getElementById('syncDot');
      const txt = document.getElementById('syncText');
      dot.className = 'dot ' + (type === 'synced' ? 'synced' : type === 'offline' ? 'offline' : '');
      txt.innerText = msg;
    }

    async function syncData() {
      if (!isConfigured() || !navigator.onLine || isSyncing) return;
      isSyncing = true;
      updateSyncStatus('syncing', 'Syncing...');

      const token = localStorage.getItem('gh_token');
      const user = localStorage.getItem('gh_user');
      const repo = localStorage.getItem('gh_repo');
      const pass = localStorage.getItem('sec_pass');
      const url = `https://api.github.com/repos/${user}/${repo}/contents/${DB_FILE}`;

      try {
        const getRes = await fetch(url, {
          headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
        });

        if (getRes.status === 200) {
          const fileInfo = await getRes.json();
          syncSha = fileInfo.sha;
          const remoteCipher = decodeURIComponent(escape(atob(fileInfo.content)));
          const decryptedJson = await decryptPayload(remoteCipher, pass);
          const remoteData = JSON.parse(decryptedJson);

          if (!appData.lastUpdated || remoteData.lastUpdated >= appData.lastUpdated) {
            appData = remoteData;
            saveLocalData();
            renderCustomerList();
          } else {
            await pushToGitHub(url, token, pass);
          }
          updateSyncStatus('synced', 'Live Cloud Synced');
        } else if (getRes.status === 404) {
          await pushToGitHub(url, token, pass);
          updateSyncStatus('synced', 'First Sync Done');
        } else {
          throw new Error('Auth or repo mismatch');
        }
      } catch (err) {
        console.error(err);
        updateSyncStatus('offline', 'Sync Error');
      } finally {
        isSyncing = false;
      }
    }

    async function pushToGitHub(url, token, pass) {
      saveLocalData();
      const encryptedBase64 = await encryptPayload(JSON.stringify(appData), pass);
      const payload = {
        message: `Sync Pandeys Pet World: ${new Date().toISOString()}`,
        content: btoa(unescape(encodeURIComponent(encryptedBase64))),
        sha: syncSha || undefined
      };

      const putRes = await fetch(url, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (putRes.ok) {
        const resData = await putRes.json();
        syncSha = resData.content.sha;
        updateSyncStatus('synced', 'Live Cloud Synced');
      }
    }

    /* ==========================================
       BACKUP, RESTORE, EXCEL & OKCREDIT IMPORT
       ========================================== */
    function downloadJsonBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `Pandeys_Pet_World_Backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function restoreJsonBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && Array.isArray(parsed.customers)) {
            appData = parsed;
            saveLocalData();
            renderCustomerList();
            await syncData();
            alert('Backup successfully restore ho gaya!');
            closeModal('configModal');
          } else {
            alert('Invalid backup file structure.');
          }
        } catch (err) {
          alert('JSON file read karne me error aayi.');
        }
      };
      reader.readAsText(file);
    }

    function exportToExcel() {
      if (!appData.customers || appData.customers.length === 0) {
        alert('Export karne ke liye koi data nahi hai.');
        return;
      }

      let csv = "\uFEFF"; // UTF-8 BOM for Excel Hindi support
      csv += "Customer Name,Mobile,Status,Net Balance,Date,Transaction Type,Amount (INR),Note\n";

      appData.customers.forEach(c => {
        const net = getCustomerNetBalance(c);
        const status = evaluateCustomerStatus(c).label;
        const txs = c.transactions || [];

        if (txs.length === 0) {
          csv += `"${c.name}","${c.phone || ''}","${status}","${net}","","","",""\n`;
        } else {
          txs.forEach(tx => {
            const cleanNote = (tx.note || '').replace(/"/g, '""');
            csv += `"${c.name}","${c.phone || ''}","${status}","${net}","${tx.date}","${tx.type === 'GIVEN' ? 'Udhar Diya' : 'Jama Hua'}","${tx.amount}","${cleanNote}"\n`;
          });
        }
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `Pandeys_Pet_World_Ledger_${new Date().toISOString().split('T')[0]}.csv`);
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function importFromOkCredit(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        const text = e.target.result;
        try {
          if (file.name.endsWith('.json')) {
            const json = JSON.parse(text);
            parseOkCreditJson(json);
          } else {
            parseOkCreditCsv(text);
          }
          saveLocalData();
          renderCustomerList();
          await syncData();
          alert('OkCredit data successfully import & sync ho gaya!');
          closeModal('configModal');
        } catch (err) {
          console.error(err);
          alert('OkCredit file parse karne me samasya aayi. Format check karein.');
        }
      };
      reader.readAsText(file);
    }

    function parseOkCreditCsv(csvText) {
      const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== "");
      if (lines.length < 2) return;

      const headers = lines[0].toLowerCase().split(',').map(h => h.replace(/["\s]/g, ''));
      const nameIdx = headers.findIndex(h => h.includes('name') || h.includes('customer'));
      const phoneIdx = headers.findIndex(h => h.includes('phone') || h.includes('mobile'));
      const amountIdx = headers.findIndex(h => h.includes('amount') || h.includes('balance') || h.includes('due'));
      const typeIdx = headers.findIndex(h => h.includes('type') || h.includes('payment') || h.includes('credit'));
      const dateIdx = headers.findIndex(h => h.includes('date'));

      for (let i = 1; i < lines.length; i++) {
        const row = lines[i].split(',').map(item => item.replace(/"/g, '').trim());
        const custName = row[nameIdx] || 'Imported Customer';
        const custPhone = phoneIdx !== -1 ? row[phoneIdx] : '';
        const amt = parseFloat(row[amountIdx] || 0);
        const rawType = (typeIdx !== -1 ? row[typeIdx] : '').toLowerCase();
        const date = (dateIdx !== -1 && row[dateIdx]) ? row[dateIdx] : new Date().toISOString().split('T')[0];

        let targetCust = appData.customers.find(c => c.name.toLowerCase() === custName.toLowerCase() || (custPhone && c.phone === custPhone));
        if (!targetCust) {
          targetCust = {
            id: 'cust_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            name: custName,
            phone: custPhone,
            transactions: []
          };
          appData.customers.push(targetCust);
        }

        if (amt > 0) {
          const isGiven = rawType.includes('given') || rawType.includes('debit') || rawType.includes('udhar') || rawType.includes('due');
          targetCust.transactions.push({
            id: 'tx_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            type: isGiven ? 'GIVEN' : 'GOT',
            amount: amt,
            note: 'OkCredit Migration',
            date: date
          });
        }
      }
    }

    function parseOkCreditJson(data) {
      const records = Array.isArray(data) ? data : (data.customers || data.data || []);
      records.forEach(r => {
        const name = r.name || r.customer_name || 'Imported Customer';
        const phone = r.phone || r.mobile || '';
        let targetCust = appData.customers.find(c => c.name.toLowerCase() === name.toLowerCase() || (phone && c.phone === phone));
        if (!targetCust) {
          targetCust = {
            id: 'cust_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
            name: name,
            phone: phone,
            transactions: []
          };
          appData.customers.push(targetCust);
        }

        const txs = r.transactions || [];
        txs.forEach(t => {
          targetCust.transactions.push({
            id: 'tx_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            type: (t.type === 'GIVEN' || t.type === 'debit') ? 'GIVEN' : 'GOT',
            amount: parseFloat(t.amount || 0),
            note: t.note || 'OkCredit Migration',
            date: t.date || new Date().toISOString().split('T')[0]
          });
        });
      });
    }

    /* ==========================================
       CUSTOMER BEHAVIOR CLASSIFICATION
       ========================================== */
    function evaluateCustomerStatus(customer) {
      const net = getCustomerNetBalance(customer);
      if (net <= 0) return { label: 'Vyavharik', class: 'vyavaharik', badge: 'badge-vyavaharik' };

      const txs = customer.transactions || [];
      const now = Date.now();
      const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;

      let isOldDue = false;
      for (let tx of txs) {
        if (tx.type === 'GIVEN') {
          const txTime = new Date(tx.date).getTime();
          if (now - txTime > thirtyDaysMs) {
            isOldDue = true;
            break;
          }
        }
      }

      if (isOldDue) return { label: 'Defaulter (30+ Din)', class: 'defaulter', badge: 'badge-defaulter' };
      return { label: 'Vyavharik', class: 'vyavaharik', badge: 'badge-vyavaharik' };
    }

    function getCustomerNetBalance(customer) {
      return (customer.transactions || []).reduce((acc, tx) => {
        return tx.type === 'GIVEN' ? acc + tx.amount : acc - tx.amount;
      }, 0);
    }

    /* ==========================================
       UI RENDERING & TRANSACTIONS
       ========================================== */
    function renderCustomerList() {
      const container = document.getElementById('customerList');
      const query = document.getElementById('searchInput').value.toLowerCase();
      container.innerHTML = '';

      let totalDue = 0;
      let totalPaid = 0;

      const filtered = appData.customers.filter(c => 
        c.name.toLowerCase().includes(query) || (c.phone && c.phone.includes(query))
      );

      filtered.forEach(cust => {
        const net = getCustomerNetBalance(cust);
        const status = evaluateCustomerStatus(cust);

        if (net > 0) totalDue += net;
        else if (net < 0) totalPaid += Math.abs(net);

        const card = document.createElement('div');
        card.className = `customer-card ${status.class}`;
        card.onclick = () => openLedger(cust.id);
        card.innerHTML = `
          <div class="cust-info">
            <h4>${escapeHtml(cust.name)}</h4>
            <p>${cust.phone || 'No Contact'}</p>
            <span class="badge ${status.badge}">${status.label}</span>
          </div>
          <div class="cust-balance">
            <span class="${net > 0 ? 'text-danger' : 'text-success'}">₹${Math.abs(net)}</span>
            <small>${net > 0 ? 'Lena Hai' : net < 0 ? 'Advance' : 'Chutta'}</small>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('totalDue').innerText = `₹${totalDue}`;
      document.getElementById('totalPaid').innerText = `₹${totalPaid}`;
    }

    function openLedger(id) {
      currentCustomerId = id;
      const cust = appData.customers.find(c => c.id === id);
      if (!cust) return;

      document.getElementById('ledgerCustName').innerText = cust.name;
      document.getElementById('ledgerCustPhone').innerText = cust.phone ? `📱 ${cust.phone}` : 'No phone registered';

      const net = getCustomerNetBalance(cust);
      const status = evaluateCustomerStatus(cust);

      const netEl = document.getElementById('ledgerNetBalance');
      netEl.innerText = `₹${Math.abs(net)} (${net > 0 ? 'Lena Hai' : net < 0 ? 'Advance Jama' : 'Hisaab Nill'})`;
      netEl.className = net > 0 ? 'text-danger' : 'text-success';

      const badgeEl = document.getElementById('ledgerBehaviorBadge');
      badgeEl.className = `badge ${status.badge}`;
      badgeEl.innerText = status.label;

      const txBox = document.getElementById('ledgerTxList');
      txBox.innerHTML = '';
      (cust.transactions || []).slice().reverse().forEach(tx => {
        const row = document.createElement('div');
        row.className = 'tx-row';
        row.innerHTML = `
          <div>
            <strong>${escapeHtml(tx.note || (tx.type === 'GIVEN' ? 'Udhar Diya' : 'Jama Hua'))}</strong>
            <div style="font-size:0.75rem; color:var(--text-muted);">${tx.date}</div>
          </div>
          <div style="font-weight:700;" class="${tx.type === 'GIVEN' ? 'text-danger' : 'text-success'}">
            ${tx.type === 'GIVEN' ? '-' : '+'} ₹${tx.amount}
          </div>
        `;
        txBox.appendChild(row);
      });

      calcClear();
      document.getElementById('txNote').value = '';
      document.getElementById('txDate').valueAsDate = new Date();
      openModal('ledgerModal');
    }

    async function recordTransaction(type) {
      const amount = parseFloat(document.getElementById('calcScreen').value);
      if (isNaN(amount) || amount <= 0) {
        alert('Kripya valid amount darj karein');
        return;
      }

      const note = document.getElementById('txNote').value.trim();
      const date = document.getElementById('txDate').value || new Date().toISOString().split('T')[0];
      const sendWA = document.getElementById('chkWhatsApp').checked;
      const sendSMS = document.getElementById('chkTextSMS').checked;

      const cust = appData.customers.find(c => c.id === currentCustomerId);
      if (!cust) return;

      if (!cust.transactions) cust.transactions = [];
      cust.transactions.push({
        id: 'tx_' + Date.now(),
        type: type,
        amount: amount,
        note: note,
        date: date
      });

      const updatedNet = getCustomerNetBalance(cust);

      if (cust.phone) {
        const messageText = composeMessage(cust.name, type, amount, updatedNet, note);
        const cleanPhone = cust.phone.replace(/[^0-9]/g, '');

        if (sendWA) {
          const waPhone = cleanPhone.length === 10 ? '91' + cleanPhone : cleanPhone;
          window.open(`https://wa.me/${waPhone}?text=${encodeURIComponent(messageText)}`, '_blank');
        }
        if (sendSMS) {
          window.open(`sms:${cleanPhone}?body=${encodeURIComponent(messageText)}`, '_blank');
        }
      }

      saveLocalData();
      renderCustomerList();
      closeModal('ledgerModal');
      syncData();
    }

    function composeMessage(custName, type, amount, currentBalance, note) {
      const actionText = type === 'GIVEN'
        ? `ke roop me ₹${amount} ka hisaab joda gaya hai`
        : `ke roop me ₹${amount} prapt hue, dhanyawad`;

      const balanceText = currentBalance > 0 
        ? `Kul baki rashi (Due): ₹${currentBalance}`
        : `Hisaab barabar/Advance: ₹${Math.abs(currentBalance)}`;

      const noteDetails = note ? ` (${note})` : '';

      return `Namaste ${custName} ji,\n\nPandey's Pet World ke sath vyavahar hetu aabhar.\nAapke khate me ${actionText}${noteDetails}.\n${balanceText}.\n\n- Pandey's Pet World`;
    }

    /* ==========================================
       BUILT-IN CALCULATOR
       ========================================== */
    function calcPress(val) {
      if (calcExpression === "0" && !isNaN(val)) calcExpression = val;
      else calcExpression += val;
      document.getElementById('calcScreen').value = calcExpression;
    }

    function calcClear() {
      calcExpression = "0";
      document.getElementById('calcScreen').value = calcExpression;
    }

    function calcEval() {
      try {
        const sanitized = calcExpression.replace(/[^0-9+\-*/.]/g, '');
        const res = Function(`'use strict'; return (${sanitized})`)();
        calcExpression = String(Math.round(res * 100) / 100);
        document.getElementById('calcScreen').value = calcExpression;
      } catch (e) {
        document.getElementById('calcScreen').value = "Error";
        calcExpression = "0";
      }
    }

    function applyPreset(pct) {
      calcEval();
      let currentVal = parseFloat(document.getElementById('calcScreen').value);
      if (isNaN(currentVal) || currentVal <= 0) return;

      const delta = (currentVal * pct) / 100;
      const finalVal = Math.round((currentVal + delta) * 100) / 100;
      calcExpression = String(finalVal);
      document.getElementById('calcScreen').value = calcExpression;
    }

    /* ==========================================
       CUSTOMER CREATION & SETTINGS
       ========================================== */
    function saveNewCustomer() {
      const name = document.getElementById('newCustName').value.trim();
      const phone = document.getElementById('newCustPhone').value.trim();

      if (!name) {
        alert('Customer naam bharna zaroori hai.');
        return;
      }

      appData.customers.push({
        id: 'cust_' + Date.now(),
        name: name,
        phone: phone,
        transactions: []
      });

      document.getElementById('newCustName').value = '';
      document.getElementById('newCustPhone').value = '';

      saveLocalData();
      renderCustomerList();
      closeModal('addCustomerModal');
      syncData();
    }

    function openConfigModal() {
      document.getElementById('cfgToken').value = localStorage.getItem('gh_token') || '';
      document.getElementById('cfgUsername').value = localStorage.getItem('gh_user') || 'TechIsInMyDNA';
      document.getElementById('cfgRepo').value = localStorage.getItem('gh_repo') || 'Pandeys-Pet-World-BahiKhata';
      document.getElementById('cfgPassphrase').value = localStorage.getItem('sec_pass') || '';

      document.getElementById('cfgPreset1').value = localStorage.getItem('cfg_p1') || "-5";
      document.getElementById('cfgPreset2').value = localStorage.getItem('cfg_p2') || "8";
      document.getElementById('cfgPreset3').value = localStorage.getItem('cfg_p3') || "-10";

      openModal('configModal');
    }

    async function saveSettings() {
      const token = document.getElementById('cfgToken').value.trim();
      const user = document.getElementById('cfgUsername').value.trim();
      const repo = document.getElementById('cfgRepo').value.trim();
      const pass = document.getElementById('cfgPassphrase').value.trim();

      const p1 = document.getElementById('cfgPreset1').value.trim() || "-5";
      const p2 = document.getElementById('cfgPreset2').value.trim() || "8";
      const p3 = document.getElementById('cfgPreset3').value.trim() || "-10";

      localStorage.setItem('cfg_p1', p1);
      localStorage.setItem('cfg_p2', p2);
      localStorage.setItem('cfg_p3', p3);
      loadPresetButtons();

      if (token && user && repo && pass) {
        localStorage.setItem('gh_token', token);
        localStorage.setItem('gh_user', user);
        localStorage.setItem('gh_repo', repo);
        localStorage.setItem('sec_pass', pass);
      }

      closeModal('configModal');
      await syncData();
    }

    function openAddCustomerModal() { openModal('addCustomerModal'); }
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }
  </script>
